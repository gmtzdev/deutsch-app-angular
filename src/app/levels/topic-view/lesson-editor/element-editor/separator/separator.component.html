<div class="separator-editor" role="group" aria-label="Tipo de separador">
    @for (option of options; track option.value) {
    <button type="button" class="separator-option" [class.separator-option--active]="separatorStyle() === option.value"
        [attr.aria-pressed]="separatorStyle() === option.value"
        [attr.aria-label]="'Seleccionar tipo de separador ' + option.label" (click)="selectStyle(option.value)">
        <span class="separator-option__preview separator-option__preview--{{ option.value}}" aria-hidden="true">
            <span></span>
        </span>
        <span class="separator-option__label">{{ option.label }}</span>
        <span class="separator-option__description">{{ option.description }}</span>
    </button>
    }
</div>
